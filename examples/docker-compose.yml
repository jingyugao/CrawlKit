services:
  # Chrome instance 1
  chrome1:
    image: browserless/chrome:latest
    ports:
      - "9222:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
      - PREBOOT_CHROME=true
      - ENABLE_DEBUGGER=false
    shm_size: 2gb
    restart: unless-stopped
    networks:
      - pwutil-network

  # Chrome instance 2
  chrome2:
    image: browserless/chrome:latest
    ports:
      - "9223:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
      - PREBOOT_CHROME=true
      - ENABLE_DEBUGGER=false
    shm_size: 2gb
    restart: unless-stopped
    networks:
      - pwutil-network

  # Test web server
  test-web:
    build:
      context: .
      dockerfile: Dockerfile.test-web
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    networks:
      - pwutil-network

networks:
  pwutil-network:
    driver: bridge

# Usage:
# 1. Start all services:
#    docker-compose up -d
#
# 2. Check services are running:
#    docker-compose ps
#
# 3. Run tests:
#    python test_pool.py
#
# 4. View logs:
#    docker-compose logs chrome1
#    docker-compose logs chrome2
#    docker-compose logs test-web
#
# 5. Stop all services:
#    docker-compose down
