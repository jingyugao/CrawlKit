name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy bandit safety playwright
          pip install -e .

      - name: Run Black (format check)
        run: |
          black --check src/pagepool/ tests/ --line-length 100
        continue-on-error: true

      - name: Run isort (import sorting)
        run: |
          isort --check-only src/pagepool/ tests/ --profile black
        continue-on-error: true

      - name: Run Ruff (linting)
        run: |
          ruff check src/pagepool/ tests/ --output-format=github

      - name: Run mypy (type checking)
        run: |
          mypy src/pagepool/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run Bandit (security check)
        run: |
          bandit -r src/pagepool/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Check dependencies for vulnerabilities
        run: |
          safety check --json
        continue-on-error: true

  complexity:
    name: Code Complexity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install radon
        run: pip install radon

      - name: Calculate cyclomatic complexity
        run: |
          radon cc src/pagepool/ -a -s

      - name: Calculate maintainability index
        run: |
          radon mi src/pagepool/ -s
