apiVersion: v1
kind: ConfigMap
metadata:
  name: sse-nginx-conf
data:
  nginx.conf: |
    worker_processes 1;
    events {
      worker_connections 1024;
    }
    http {
      upstream sse_backend {
        server sse-demo.default.svc.cluster.local:80;
      }
      server {
        listen 80;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        location / {
          proxy_pass http://sse_backend;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sse-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sse-nginx
  template:
    metadata:
      labels:
        app: sse-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: sse-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: sse-nginx
spec:
  selector:
    app: sse-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
