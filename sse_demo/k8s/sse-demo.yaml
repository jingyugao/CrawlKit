apiVersion: apps/v1
kind: Deployment
metadata:
  name: sse-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sse-demo
  template:
    metadata:
      labels:
        app: sse-demo
    spec:
      terminationGracePeriodSeconds: 210
      containers:
        - name: sse-demo
          image: sse-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SSE_MAX_DURATION
              value: "180"
            - name: SSE_SHUTDOWN_WAIT
              value: "200"
            - name: SSE_INTERVAL
              value: "1.0"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sse-demo
spec:
  selector:
    app: sse-demo
  ports:
    - name: http
      port: 80
      targetPort: 8000
